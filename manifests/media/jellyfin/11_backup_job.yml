apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-backup-job
  namespace: storage
  labels:
    app: jellyfin-backup-job
spec:
  schedule: 50 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: jellyfin-backup-job
        spec:
          containers:
          - name: jellyfin-backup
            image: ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: jellyfin
            - name: BACKUP_METHOD
              value: sqlite
            - name: BACKUP_PRUNE
              value: dry-run
            - name: SQLITE_DB
              value: data/jellyfin.db data/library.db
            volumeMounts:
            - name: jellyfin
              mountPath: /mnt/source
            - name: backup
              mountPath: /mnt/backups
          restartPolicy: OnFailure
          volumes:
          - name: jellyfin
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/jellyfin-config
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
