apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: jellyfin
  template:
    metadata:
      labels:
        role: jellyfin
    spec:
      initContainers:
      - name: restore-db
        image: litestream/litestream:0.5.17
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, /restore/restore.sh]
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: db
          mountPath: /db
        - name: replica
          mountPath: /replica
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: configuration
          mountPath: /config
        - name: litestream
          mountPath: /restore
          readOnly: true
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:10.10.5
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        livenessProbe:
          tcpSocket:
            port: 8096
          initialDelaySeconds: 60
          periodSeconds: 5
        ports:
        - name: server
          containerPort: 8096
          protocol: TCP
        volumeMounts:
        - name: media
          mountPath: /data/media
        - name: configuration
          mountPath: /config
        - name: db
          mountPath: /db
      - name: litestream
        image: litestream/litestream:0.5.17
        imagePullPolicy: IfNotPresent
        args: [replicate, -config, /restore/litestream.yml]
        volumeMounts:
        - name: db
          mountPath: /db
        - name: replica
          mountPath: /replica
        - name: litestream
          mountPath: /restore
          readOnly: true
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: calligraphy-media
      - name: configuration
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/jellyfin-config/
      - name: db
        emptyDir: {}
      - name: replica
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/jellyfin-config/replica
      - name: seed
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/jellyfin-config/data
          readOnly: true
      - name: litestream
        configMap:
          name: jellyfin-litestream
