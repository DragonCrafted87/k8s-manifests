apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-library-backup-job
  namespace: storage
  labels:
    app: jellyfin-library-backup-job
spec:
  schedule: 55 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: jellyfin-library-backup-job
        spec:
          containers:
          - name: jellyfin-library-backup
            image: ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: jellyfin-library
            - name: BACKUP_METHOD
              value: litestream
            - name: BACKUP_PRUNE
              value: dry-run
            - name: LITESTREAM_DB
              value: /db/library.db
            - name: LITESTREAM_REPLICA
              value: /mnt/replica
            volumeMounts:
            - name: replica
              mountPath: /mnt/replica
              readOnly: true
            - name: backup
              mountPath: /mnt/backups
          restartPolicy: OnFailure
          volumes:
          - name: replica
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/jellyfin-config/replica/library
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
