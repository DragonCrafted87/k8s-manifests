apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: prayers
  labels:
    app: prayers
spec:
  replicas: 1
  selector:
    matchLabels:
      role: prayers
  template:
    metadata:
      labels:
        role: prayers
    spec:
      containers:
      - name: prayers
                # ghcr.io/jitesoft/lighttpd:1.4.76
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/ghcr.io/jitesoft/lighttpd@sha256:1a74266c920e90dd9dbf9d8439292ab76d65e3f183d0d8bb9719b0ff490a4eca
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 5
        ports:
        - name: server
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: configuration
          mountPath: /var/www/html/
      volumes:
      - name: configuration
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/prayers/
