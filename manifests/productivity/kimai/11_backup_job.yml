apiVersion: batch/v1
kind: CronJob
metadata:
  name: kimai-backup-job
  namespace: productivity
  labels:
    app: kimai-backup-job
spec:
  schedule: 40 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: kimai-backup-job
        spec:
          containers:
          - name: kimai-backup
            # ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            # yamllint disable-line rule:line-length
            image: pulp.stealthdragonland.net/ghcr.io/dragoncrafted87/alpine-backup-cron@sha256:66a02b0d97024f2f179d4a3ddf6ffcf2217598da0d5cb25a13c7e7341bb01d9a
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: kimai
            - name: BACKUP_METHOD
              value: mysql
            - name: BACKUP_PRUNE
              value: apply
            - name: MYSQL_HOST
              value: kimai-mysql
            - name: MYSQL_USER
              value: root
            - name: MYSQL_DATABASE
              value: kimai
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: kimai-database-pass
                  key: password
            volumeMounts:
            - name: backup
              mountPath: /mnt/backups
              subPath: kimai
          restartPolicy: OnFailure
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
