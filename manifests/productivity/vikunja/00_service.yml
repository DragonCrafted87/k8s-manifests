apiVersion: v1
kind: Service
metadata:
  namespace: productivity
  name: vikunja-tcp
  annotations:
    metallb.universe.tf/allow-shared-ip: vikunja
spec:
  ports:
  - name: web
    port: 80
    targetPort: 3456
    protocol: TCP
  selector:
    role: vikunja
  type: LoadBalancer
  loadBalancerIP: 192.168.8.52
