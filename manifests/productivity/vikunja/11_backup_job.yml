apiVersion: batch/v1
kind: CronJob
metadata:
  name: vikunja-backup-job
  namespace: storage
  labels:
    app: vikunja-backup-job
spec:
  schedule: 20 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: vikunja-backup-job
        spec:
          containers:
          - name: vikunja-backup
            image: ghcr.io/dragoncrafted87/alpine-backup-cron:2.0.1
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: vikunja
            volumeMounts:
            - name: vikunja
              mountPath: /mnt/source
            - name: backup
              mountPath: /mnt/backups
          restartPolicy: OnFailure
          volumes:
          - name: vikunja
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/vikunja
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
