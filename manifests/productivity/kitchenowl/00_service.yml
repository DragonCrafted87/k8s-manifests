apiVersion: v1
kind: Service
metadata:
  namespace: productivity
  name: kitchenowl-tcp
  annotations:
    metallb.universe.tf/allow-shared-ip: kitchenowl
spec:
  ports:
  - name: web
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    role: kitchenowl
  type: LoadBalancer
  loadBalancerIP: 192.168.8.51
