apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: productivity
  name: kitchenowl
  labels:
    app: kitchenowl
spec:
  replicas: 1
  selector:
    matchLabels:
      role: kitchenowl
  template:
    metadata:
      labels:
        role: kitchenowl
    spec:
      containers:
      - name: kitchenowl
        image: tombursch/kitchenowl:v0.7.10
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kitchenowl-jwt
              key: JWT_SECRET_KEY
        - name: FRONT_URL
          value: https://kitchen.stealthdragonland.net
        - name: DB_SQLITE_SYNCHRONOUS
          value: NORMAL
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 40
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/kitchenowl
