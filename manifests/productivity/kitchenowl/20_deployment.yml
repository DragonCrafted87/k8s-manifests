apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: productivity
  name: kitchenowl
  labels:
    app: kitchenowl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: kitchenowl
  template:
    metadata:
      labels:
        role: kitchenowl
    spec:
      initContainers:
      - name: restore-db
        # litestream/litestream:0.5.17
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/docker.io/litestream/litestream@sha256:dff47ab648faddd4b6385e9eeebc1649edd84fb020c576e8b9311cf1dc4a0155
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, /restore/restore.sh]
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: data
          mountPath: /data
        - name: replica
          mountPath: /replica
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: litestream
          mountPath: /restore
          readOnly: true
      containers:
      - name: kitchenowl
                # tombursch/kitchenowl:v0.7.10
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/docker.io/tombursch/kitchenowl@sha256:23e2fcb761350992af2566ebf6e565ae6dd0148f87c652ae30abcc441f2ea202
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kitchenowl-jwt
              key: JWT_SECRET_KEY
        - name: FRONT_URL
          value: https://kitchen.stealthdragonland.net
        - name: DB_SQLITE_SYNCHRONOUS
          value: NORMAL
        ports:
        - name: web
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 40
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
        - name: upload
          mountPath: /data/upload
      - name: litestream
        # litestream/litestream:0.5.17
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/docker.io/litestream/litestream@sha256:dff47ab648faddd4b6385e9eeebc1649edd84fb020c576e8b9311cf1dc4a0155
        imagePullPolicy: IfNotPresent
        args: [replicate, -config, /restore/litestream.yml]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: replica
          mountPath: /replica
        - name: litestream
          mountPath: /restore
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: upload
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/kitchenowl/upload
      - name: replica
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/kitchenowl/replica
      - name: seed
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/kitchenowl
      - name: litestream
        configMap:
          name: kitchenowl-litestream
