apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: games
  name: foundry
  labels:
    app: foundry
spec:
  replicas: 1
  selector:
    matchLabels:
      role: foundry
  template:
    metadata:
      labels:
        role: foundry
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: homelab.stealthdragonland.net/subrole-nfs-server
                operator: DoesNotExist
      # Foundry signs the license to os.hostname(). A generated pod name fails that check.
      hostname: foundry
      securityContext:
        fsGroup: 1000
      dnsConfig:
        options:
        - name: timeout
          value: '10'
        - name: attempts
          value: '5'
        - name: ndots
          value: '1'
      containers:
      - name: foundry
                # ghcr.io/dragoncrafted87/alpine-foundry-vtt-runner:2.1.1
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/ghcr.io/dragoncrafted87/alpine-foundry-vtt-runner@sha256:37730aece3e4da000b63b0a1468837bc4b6db0a6c1dd9327caf3e531439bfe54
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        ports:
        - name: server
          containerPort: 30000
          protocol: TCP
        volumeMounts:
        - name: server
          mountPath: /home/docker/server
        - name: data
          mountPath: /home/docker/data
      volumes:
      - name: server
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/foundry/server
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/foundry/data
