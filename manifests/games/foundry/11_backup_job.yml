apiVersion: batch/v1
kind: CronJob
metadata:
  name: foundry-backup-job
  namespace: storage
  labels:
    app: foundry-backup-job
spec:
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: foundry-backup-job
        spec:
          containers:
          - name: foundry-backup
            image: ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: foundry
            - name: BACKUP_PRUNE
              value: dry-run
            volumeMounts:
            - name: foundry
              mountPath: /mnt/source
              readOnly: true
            - name: backup
              mountPath: /mnt/backups
          restartPolicy: OnFailure
          volumes:
          - name: foundry
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/foundry/data
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
