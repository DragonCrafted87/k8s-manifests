apiVersion: batch/v1
kind: CronJob
metadata:
  name: foundry-backup-job
  namespace: storage
  labels:
    app: foundry-backup-job
spec:
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: foundry-backup-job
        spec:
          containers:
          - name: foundry-backup
            # ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            # yamllint disable-line rule:line-length
            image: pulp.stealthdragonland.net/ghcr.io/dragoncrafted87/alpine-backup-cron@sha256:66a02b0d97024f2f179d4a3ddf6ffcf2217598da0d5cb25a13c7e7341bb01d9a
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: foundry
            - name: BACKUP_PRUNE
              value: apply
            volumeMounts:
            - name: foundry
              mountPath: /mnt/source
              readOnly: true
            - name: backup
              mountPath: /mnt/backups
              subPath: foundry
          restartPolicy: OnFailure
          volumes:
          - name: foundry
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/foundry/data
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
