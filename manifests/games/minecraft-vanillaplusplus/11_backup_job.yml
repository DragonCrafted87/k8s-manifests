apiVersion: batch/v1
kind: CronJob
metadata:
  name: mc-vpp-backup-job
  namespace: storage
  labels:
    app: mc-vpp-backup-job
spec:
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: mc-vpp-backup-job
        spec:
          containers:
          - name: mc-vpp-backup
            # ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            # yamllint disable-line rule:line-length
            image: pulp.stealthdragonland.net/ghcr.io/dragoncrafted87/alpine-backup-cron@sha256:66a02b0d97024f2f179d4a3ddf6ffcf2217598da0d5cb25a13c7e7341bb01d9a
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: minecraft-vpp-backup
            - name: BACKUP_PRUNE
              value: apply
            - name: RCON_HOST
              value: minecraft-vpp.games.svc.cluster.local
            volumeMounts:
            - name: minecraft
              mountPath: /mnt/source
              readOnly: true
            - name: backup
              mountPath: /mnt/backups
              subPath: minecraft-vpp-backup
          restartPolicy: OnFailure
          volumes:
          - name: minecraft
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/minecraft-vanillaplusplus
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
