apiVersion: batch/v1
kind: CronJob
metadata:
  name: mc-red-backup-job
  namespace: storage
  labels:
    app: mc-red-backup-job
spec:
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: mc-red-backup-job
        spec:
          containers:
          - name: mc-red-backup
            image: ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: minecraft-redstone
            - name: BACKUP_PRUNE
              value: apply
            - name: RCON_HOST
              value: minecraft-redstone.games.svc.cluster.local
            volumeMounts:
            - name: minecraft
              mountPath: /mnt/source
              readOnly: true
            - name: backup
              mountPath: /mnt/backups
              subPath: minecraft-redstone
          restartPolicy: OnFailure
          volumes:
          - name: minecraft
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/minecraft-redstone
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
