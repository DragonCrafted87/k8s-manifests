# The image sets no user, so the pod stays root, the same way
# KitchenOwl does. auth.json is created by the login Scott runs
# later, at /data/.local/share/opencode/auth.json. Leave the
# volume empty. Sessions and opencode.db land on the same volume.
#
# TODO: task 172 backup audit. Stateful volume
# hoard-drake:/srv/data/opencode. Do not change the backup image here.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: agents
  name: opencode
  labels:
    app: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: opencode
  template:
    metadata:
      labels:
        role: opencode
    spec:
      automountServiceAccountToken: false
      containers:
      - name: opencode
                # ghcr.io/anomalyco/opencode:1.19.4
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/ghcr.io/anomalyco/opencode@sha256:1735f7bdd4f33b55fb75e151442af7115e04ced001356ff3f1658c359179757a
        imagePullPolicy: IfNotPresent
        args:
        - serve
        - --hostname
        - 0.0.0.0
        - --port
        - '4096'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        env:
        - name: TZ
          value: America/Chicago
        - name: HOME
          value: /data
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opencode-secret
              key: OPENCODE_SERVER_PASSWORD
        ports:
        - name: web
          containerPort: 4096
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: web
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          tcpSocket:
            port: web
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: web
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/opencode
