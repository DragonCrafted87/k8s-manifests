apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-backup-job
  namespace: storage
  labels:
    app: hermes-backup-job
spec:
  schedule: 40 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: hermes-backup-job
        spec:
          containers:
          - name: hermes-backup
            image: ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: hermes
            - name: BACKUP_METHOD
              value: litestream
            - name: BACKUP_PRUNE
              value: apply
            - name: LITESTREAM_DB
              value: /db/state.db
            - name: LITESTREAM_REPLICA
              value: /mnt/replica
            volumeMounts:
            - name: replica
              mountPath: /mnt/replica
              readOnly: true
            - name: backup
              mountPath: /mnt/backups
              subPath: hermes
          restartPolicy: OnFailure
          volumes:
          - name: replica
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/hermes/replica
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
