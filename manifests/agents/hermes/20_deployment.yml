# yamllint disable rule:indentation
# Hand-maintained from the jyje hermes-agent chart 1.21.0 render
# (appVersion v0.22.2). The chart is not installed at runtime.
# The render's Secret, PVC, ServiceAccount, Helm labels, model
# provider, and root-only chown branch are not kept. The migration
# script in the ConfigMap is the chart file files/config_migrate.py.
#
# Dashboard OIDC is supported (HERMES_DASHBOARD_OIDC_ISSUER and
# HERMES_DASHBOARD_OIDC_CLIENT_ID, public PKCE client, redirect
# https://hermes.stealthdragonland.net/auth/callback). Authentik is
# not deployed, so the dashboard uses the password in hermes-secret
# until those keys replace the basic-auth keys.
#
# TODO: task 233 (Litestream 05) for the SQLite session DB on
# /opt/data. journal_mode delete is seeded before the first start
# because this volume is NFS.
# TODO: task 172 backup audit. Stateful volume
# hoard-drake:/srv/data/hermes. Do not change the backup image here.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: agents
  name: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: hermes
  template:
    metadata:
      labels:
        role: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: seed-config
        image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: [sh, -c]
        args:
        - |
          set -eu
          if [ ! -f /opt/data/config.yaml ]; then
            cp /seed/config.yaml /opt/data/config.yaml
          fi
          PYTHONDONTWRITEBYTECODE=1 /opt/hermes/.venv/bin/python /seed/migrate-config.py
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: TZ
          value: America/Chicago
        volumeMounts:
        - name: config
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /opt/data
        - name: tmp
          mountPath: /tmp
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
        imagePullPolicy: IfNotPresent
        args: [gateway, run]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_DASHBOARD
          value: '1'
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: '8642'
        - name: TZ
          value: America/Chicago
        envFrom:
        - secretRef:
            name: hermes-secret
        ports:
        - name: dashboard
          containerPort: 9119
          protocol: TCP
        - name: api
          containerPort: 8642
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: hermes-config
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/hermes
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
