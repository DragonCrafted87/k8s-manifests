# yamllint disable rule:indentation
# Hand-maintained from the jyje hermes-agent chart 1.21.0 render
# (appVersion v0.22.2). The chart is not installed at runtime.
# The render's Secret, PVC, ServiceAccount, Helm labels, model
# provider, and root-only chown branch are not kept. The migration
# script in the ConfigMap is the chart file files/config_migrate.py.
#
# Dashboard OIDC is supported (HERMES_DASHBOARD_OIDC_ISSUER and
# HERMES_DASHBOARD_OIDC_CLIENT_ID, public PKCE client, redirect
# https://hermes.stealthdragonland.net/auth/callback). Authentik is
# not deployed, so the dashboard uses the password in hermes-secret
# until those keys replace the basic-auth keys.
#
# state.db is an emptyDir behind a symlink at /opt/data/state.db.
# v0.22.2 follows that link. A later image that requires the
# resolved parent to be HERMES_HOME will not (hermes-agent#143007).
# The rest of /opt/data stays on NFS. The nightly archive is the
# session database only, because the replica directory lives under
# this home and the backup image would archive it with BACKUP_EXTRA.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: agents
  name: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: hermes
  template:
    metadata:
      labels:
        role: hermes
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # image/Dockerfile adds the screen packages and pass-cli 2.5.1.
      # The tag is loaded into each node's containerd. It is not published.
      - name: seed-config
        image: ghcr.io/dragoncrafted87/hermes-agent:v0.22.2-screen
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: [sh, -c]
        args:
        - |
          set -eu
          if [ ! -f /opt/data/config.yaml ]; then
            cp /seed/config.yaml /opt/data/config.yaml
          fi
          PYTHONDONTWRITEBYTECODE=1 /opt/hermes/.venv/bin/python /seed/migrate-config.py
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: TZ
          value: America/Chicago
        volumeMounts:
        - name: config
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /opt/data
        - name: tmp
          mountPath: /tmp
      - name: restore-db
        image: litestream/litestream:0.5.17
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, /restore/restore.sh]
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: db
          mountPath: /db
        - name: data
          mountPath: /opt/data
        - name: replica
          mountPath: /replica
        - name: litestream
          mountPath: /restore
          readOnly: true
      containers:
      - name: hermes
        image: ghcr.io/dragoncrafted87/hermes-agent:v0.22.2-screen
        imagePullPolicy: IfNotPresent
        args: [gateway, run]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_DASHBOARD
          value: '1'
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: '8642'
        - name: TZ
          value: America/Chicago
        envFrom:
        - secretRef:
            name: hermes-secret
        ports:
        - name: dashboard
          containerPort: 9119
          protocol: TCP
        - name: api
          containerPort: 8642
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: dashboard
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
        - name: db
          mountPath: /db
      - name: litestream
        image: litestream/litestream:0.5.17
        imagePullPolicy: IfNotPresent
        args: [replicate, -config, /restore/litestream.yml]
        volumeMounts:
        - name: db
          mountPath: /db
        - name: replica
          mountPath: /replica
        - name: litestream
          mountPath: /restore
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: hermes-config
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/hermes
      - name: db
        emptyDir: {}
      - name: replica
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/hermes/replica
      - name: litestream
        configMap:
          name: hermes-litestream
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
