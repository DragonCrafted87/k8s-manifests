---
apiVersion: v1
kind: Service
metadata:
  namespace: tuleap
  name: tuleap
spec:
  ports:
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    role: tuleap
---
# Git over SSH. The web name stays on Caddy. This address is the
# git SSH endpoint until a name for it is chosen. The vpn-relay
# forwards 80 and 443 only, so this port is not on that path.
apiVersion: v1
kind: Service
metadata:
  namespace: tuleap
  name: tuleap-ssh
  annotations:
    metallb.universe.tf/allow-shared-ip: tuleap-ssh
spec:
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
  selector:
    role: tuleap
  type: LoadBalancer
  loadBalancerIP: 192.168.8.55
---
apiVersion: v1
kind: Service
metadata:
  namespace: tuleap
  name: tuleap-mysql
spec:
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
  selector:
    role: tuleap-mysql
