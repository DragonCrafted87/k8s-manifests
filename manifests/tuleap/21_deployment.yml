# Tuleap Community Edition. One replica, Recreate, /data on the
# hoard-drake export.
#
# Built from the Software Heritage 17.4 snapshot. Docker Hub and
# ci.tuleap.net no longer serve Community Edition. The image name
# stays tuleap-ce until the trademark rename.
# pulp.stealthdragonland.net/tuleap-ce:17.4.99.1792880291
# Legacy MediaWiki 1.23 is not in this image. mediawiki_standalone is.
#
# The image publishes 80, 443, and 22 and speaks HTTPS itself. Caddy
# terminates the public certificate and proxies to 443 without
# verifying the container certificate.
# https://docs.tuleap.com/installation-guide/docker/docker_compose.html
# https://docs.tuleap.com/installation-guide/docker/images-configuration.html
# https://docs.tuleap.com/installation-guide/docker/intro_docker.html
#
# No runAsNonRoot. The image starts sshd, nginx, and supervisord, and
# the compose file does not set a user.
#
# The requirements page does not publish a RAM or CPU number. It asks
# for a dedicated x86_64 server. The requests below are a small
# personal instance: 2 Gi for Tuleap and 1 Gi for MySQL. Raise the
# limits if the first boot is OOMKilled.
# https://docs.tuleap.com/installation-guide/step-by-step/requirements.html
#
# Backups: tuleap-backup-job dumps database tuleap, and
# tuleap-data-backup-job archives /data. The image is unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: tuleap
  name: tuleap
  labels:
    app: tuleap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: tuleap
  template:
    metadata:
      labels:
        role: tuleap
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # spec.hostname is a DNS label. The public name is TULEAP_FQDN.
      hostname: tuleap
      nodeSelector:
        kubernetes.io/arch: amd64
      # Same capacity note as tuleap-mysql. Uncomment to pin Tuleap
      # to hoard-drake. Do not add a taint in this change.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: kubernetes.io/hostname
      #           operator: In
      #           values: [hoard-drake]
      initContainers:
      - name: wait-mysql
        image: docker.io/library/mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - until mysqladmin ping -h tuleap-mysql -uroot --silent; do sleep 2; done
        env:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: tuleap-database
              key: root-password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      containers:
      - name: tuleap
        image: pulp.stealthdragonland.net/tuleap-ce:17.4.99.1792880291
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        - name: TULEAP_FQDN
          value: tuleap.stealthdragonland.net
        - name: TULEAP_SYS_DBHOST
          value: tuleap-mysql
        - name: DB_ADMIN_USER
          value: root
        - name: DB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tuleap-database
              key: root-password
        - name: TULEAP_SYS_DBPASSWD
          valueFrom:
            secretKeyRef:
              name: tuleap-database
              key: app-password
        - name: SITE_ADMINISTRATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tuleap-admin
              key: site-administrator-password
        ports:
        - name: https
          containerPort: 443
          protocol: TCP
        - name: ssh
          containerPort: 22
          protocol: TCP
        startupProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          periodSeconds: 15
          failureThreshold: 80
        readinessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/tuleap/data
