# Dedicated MySQL 8.4 for Tuleap. Do not point another app at this
# Service. Tuleap rejects any sql_mode other than
# NO_ENGINE_SUBSTITUTION, and it requires utf8mb4.
# https://docs.tuleap.com/installation-guide/docker/docker_compose.html
# https://docs.tuleap.com/installation-guide/step-by-step/prepare-database.html
#
# Upstream tag mysql:8.4.13. The pin is the linux/amd64 manifest,
# sha256:2068651a18ac6048578647ea57b940ca2daed3f504ebe7fba6a93beeb39aaa1f.
# An authenticated pull creates the Pulp repository. After that,
# kubelet pulls the digest with no login.
#
# The first NFS init wrote redo files and then InnoDB aborted with
# "data files are corrupt or the database was not shut down cleanly".
# Data is the local-path claim tuleap-mysql. The claim bound on
# hoard-drake. Native AIO stays off.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: tuleap
  name: tuleap-mysql
  labels:
    app: tuleap-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: tuleap-mysql
  template:
    metadata:
      labels:
        role: tuleap-mysql
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      # hoard-drake has the RAM (about 57 Gi available on 2026-10-23)
      # and the pods already there are small. Uncomment to pin MySQL
      # beside the export. Do not add a taint in this change.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: kubernetes.io/hostname
      #           operator: In
      #           values: [hoard-drake]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: mysql
        # mysql:8.4.13 linux/amd64
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/docker.io/library/mysql@sha256:2068651a18ac6048578647ea57b940ca2daed3f504ebe7fba6a93beeb39aaa1f
        imagePullPolicy: IfNotPresent
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --sql-mode=NO_ENGINE_SUBSTITUTION
        - --innodb-use-native-aio=0
        - --innodb-flush-method=fsync
        env:
        - name: TZ
          value: America/Chicago
        # The image creates root@localhost unless this is set at first
        # init. This volume was already initialized, so root@% was
        # granted on the running server as well.
        - name: MYSQL_ROOT_HOST
          value: '%'
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tuleap-database
              key: root-password
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: tuleap-database
              key: root-password
        ports:
        - name: mysql
          containerPort: 3306
          protocol: TCP
        startupProbe:
          exec:
            command: [mysqladmin, ping, -h, 127.0.0.1, -uroot, --silent]
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command: [mysqladmin, ping, -h, 127.0.0.1, -uroot, --silent]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [mysqladmin, ping, -h, 127.0.0.1, -uroot, --silent]
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tuleap-mysql
