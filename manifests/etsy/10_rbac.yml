---
# The broker account has no Role. The port-forward account can see
# pods in this namespace and open a port-forward. It is not bound to
# the workstation client, which is system:admin. This file does not
# grant cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etsy-broker
  namespace: etsy
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etsy-portforward
  namespace: etsy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etsy-oauth-operator
  namespace: etsy
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list]
- apiGroups: ['']
  resources: [pods/portforward]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etsy-oauth-operator
  namespace: etsy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etsy-oauth-operator
subjects:
- kind: ServiceAccount
  name: etsy-portforward
  namespace: etsy
---
# create cannot be limited by resourceNames. The process writes
# etsy-refresh-token and etsy-access-token. It cannot list or
# delete Secrets, and it cannot get etsy-keystring or the reader
# token. The reader account can get only etsy-access-token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etsy-refresh-writer
  namespace: etsy
rules:
- apiGroups: ['']
  resources: [secrets]
  verbs: [create]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [etsy-refresh-token, etsy-access-token]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etsy-refresh-writer
  namespace: etsy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etsy-refresh-writer
subjects:
- kind: ServiceAccount
  name: etsy-broker
  namespace: etsy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etsy-token-reader
  namespace: etsy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etsy-access-reader
  namespace: etsy
rules:
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [etsy-access-token]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etsy-access-reader
  namespace: etsy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etsy-access-reader
subjects:
- kind: ServiceAccount
  name: etsy-token-reader
  namespace: etsy
---
# The controller fills this token. It is not in git. Scott copies
# it into a kubeconfig in Proton Pass for the bot. Assistants do
# not get this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: etsy-token-reader
  namespace: etsy
  annotations:
    kubernetes.io/service-account.name: etsy-token-reader
type: kubernetes.io/service-account-token
