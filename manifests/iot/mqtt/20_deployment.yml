apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: iot
  name: mqtt
  labels:
    app.kubernetes.io/name: mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      role: mqtt
  template:
    metadata:
      labels:
        role: mqtt
    spec:
      containers:
      - name: mqtt
                # eclipse-mosquitto:2.0.18-openssl
        # yamllint disable-line rule:line-length
        image: pulp.stealthdragonland.net/docker.io/library/eclipse-mosquitto@sha256:c3db24f40dc7c60f861e71760a784122817ed305cd2d1a129d9da61df043579c
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Chicago
        ports:
        - containerPort: 1883
          name: mqtt
        volumeMounts:
        - name: conf
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
      restartPolicy: Always
      volumes:
      - name: conf
        configMap:
          name: mosquitto.conf
          items:
          - key: mosquitto.conf
            path: mosquitto.conf
