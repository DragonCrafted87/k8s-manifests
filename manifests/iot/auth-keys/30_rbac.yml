---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-keys
  namespace: iot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-keys
  namespace: iot
rules:
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [auth-keys]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-keys
  namespace: iot
subjects:
- kind: ServiceAccount
  name: auth-keys
  namespace: iot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-keys
