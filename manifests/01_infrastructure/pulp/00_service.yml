---
apiVersion: v1
kind: Service
metadata:
  namespace: infrastructure
  name: pulp-postgres
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    role: pulp-postgres
---
apiVersion: v1
kind: Service
metadata:
  namespace: infrastructure
  name: pulp-redis
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    role: pulp-redis
---
apiVersion: v1
kind: Service
metadata:
  namespace: infrastructure
  name: pulp-tcp
spec:
  ports:
  - name: api
    port: 24817
    targetPort: 24817
    protocol: TCP
  - name: content
    port: 24816
    targetPort: 24816
    protocol: TCP
  selector:
    role: pulp
  type: LoadBalancer
  loadBalancerIP: 192.168.8.53
