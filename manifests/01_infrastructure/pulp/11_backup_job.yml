apiVersion: batch/v1
kind: CronJob
metadata:
  name: pulp-backup-job
  namespace: infrastructure
  labels:
    app: pulp-backup-job
spec:
  schedule: 30 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: pulp-backup-job
        spec:
          containers:
          - name: pulp-backup
            # ghcr.io/dragoncrafted87/alpine-backup-cron:2.2.0
            # yamllint disable-line rule:line-length
            image: pulp.stealthdragonland.net/ghcr.io/dragoncrafted87/alpine-backup-cron@sha256:66a02b0d97024f2f179d4a3ddf6ffcf2217598da0d5cb25a13c7e7341bb01d9a
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: BACKUP_NAME
              value: pulp
            - name: BACKUP_METHOD
              value: postgres
            - name: BACKUP_PRUNE
              value: apply
            - name: PGHOST
              value: pulp-postgres
            - name: PGUSER
              value: pulp
            - name: PGDATABASE
              value: pulp
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulp-database
                  key: password
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: '1'
                memory: 1Gi
            volumeMounts:
            - name: backup
              mountPath: /mnt/backups
              subPath: pulp
          restartPolicy: OnFailure
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: calligraphy-backups
