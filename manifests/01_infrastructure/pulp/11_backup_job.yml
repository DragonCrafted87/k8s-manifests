# yamllint disable rule:indentation
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pulp-backup-job
  namespace: infrastructure
  labels:
    app: pulp-backup-job
spec:
  schedule: 30 4 * * *
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          name: pulp-backup-job
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          containers:
          - name: pulp-backup
            image: postgres:16.15
            imagePullPolicy: IfNotPresent
            env:
            - name: TZ
              value: America/Chicago
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulp-database
                  key: password
            command: [bash, -eu, -c]
            args:
            - |
              stamp=$(date -u +%Y%m%dT%H%M%SZ)
              pg_dump --host=pulp-postgres --username=pulp \
              --dbname=pulp --format=custom \
              --file="/mnt/backups/pulp-${stamp}.dump"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: backup
              mountPath: /mnt/backups
          restartPolicy: OnFailure
          volumes:
          - name: backup
            nfs:
              server: hoard-drake.stealthdragonland.net
              path: /srv/data/pulp/backups
