# Static SMB volumes for calligraphy-wyrm. The driver install is in
# _initial_setup/setup-cluster.sh (csi-driver-smb v1.20.3). These
# objects do not apply on the current microk8s cluster.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: calligraphy-backups
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-static
  mountOptions:
    - dir_mode=0755
    - file_mode=0644
    - noperm
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: calligraphy-backups
    volumeAttributes:
      source: "//calligraphy-wyrm.stealthdragonland.net/Backups/K8s"
    nodeStageSecretRef:
      name: cifs-secret
      namespace: storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: calligraphy-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-static
  mountOptions:
    - dir_mode=0755
    - file_mode=0644
    - noperm
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: calligraphy-media
    volumeAttributes:
      source: "//calligraphy-wyrm.stealthdragonland.net/Storage/Media"
    nodeStageSecretRef:
      name: cifs-secret
      namespace: media
