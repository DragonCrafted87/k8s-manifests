# yamllint disable rule:indentation
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-markdown
  namespace: infrastructure
data:
  vscode-markdown.css: |
    body {
      max-width: 46rem;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      font-family: Aptos, Calibri, "Book Antiqua", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 22px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: inherit;
      line-height: 1.3;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    h1 { font-size: 1.45em; }
    h2 { font-size: 1.28em; }
    h3 { font-size: 1.16em; }
    h4 { font-size: 1.08em; }
    h5,
    h6 { font-size: 1em; }

    p,
    ul,
    ol,
    blockquote,
    pre,
    table {
      margin-block: 0.8em;
    }

    li {
      margin-block: 0.25em;
    }

    a {
      text-underline-offset: 0.12em;
    }

    code {
      font-size: 0.86em;
    }

    pre {
      font-size: 0.82em;
      line-height: 1.45;
      padding: 0.8em 1em;
      overflow-x: auto;
    }

    pre code {
      font-size: inherit;
    }

    blockquote {
      margin-inline: 0;
      padding-left: 1em;
      border-left: 0.2em solid currentColor;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    th,
    td {
      padding: 0.35em 0.6em;
      border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      vertical-align: top;
    }

    hr {
      border: 0;
      border-top: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      margin: 1.6em 0;
    }
