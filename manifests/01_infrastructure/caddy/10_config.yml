# yamllint disable rule:indentation
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-configuration
  namespace: infrastructure
data:
  Caddyfile: |
    stealthdragonland.net {
    }

    dragoncrafted87.dev {
    }

    foundry.stealthdragonland.net {
      reverse_proxy 192.168.8.40
    }
    media.stealthdragonland.net {
      reverse_proxy 192.168.8.30:80
    }
    prayers.stealthdragonland.net {
      redir / /en/ 301
      reverse_proxy 192.168.8.31:80
    }
    time.stealthdragonland.net {
      reverse_proxy 192.168.8.50:80
    }
    kitchen.stealthdragonland.net {
      reverse_proxy 192.168.8.51:80
    }
    tasks.stealthdragonland.net {
      reverse_proxy 192.168.8.52:80
    }
    weatherhub.stealthdragonland.net {
      reverse_proxy 192.168.0.102:80
    }
    vscode-md.stealthdragonland.net {
      root * /srv/vscode-md
      file_server
      header Cache-Control "public, max-age=300"
    }
    pulp.stealthdragonland.net {
      route {
        @pulp_ui path /ui /ui/* /static/pulp_ui/* /pulp-ui-config.json
        handle @pulp_ui {
          reverse_proxy pulp-ui:8080
        }
        @pulp_root path /
        handle @pulp_root {
          redir * /ui/ 308
        }
        handle /v2/* {
          reverse_proxy 192.168.8.53:24817
        }
        handle /token/* {
          reverse_proxy 192.168.8.53:24817
        }
        handle /extensions/v2/* {
          reverse_proxy 192.168.8.53:24817
        }
        handle /pulp/content* {
          reverse_proxy 192.168.8.53:24816
        }
        handle /pulp/container* {
          reverse_proxy 192.168.8.53:24816
        }
        handle {
          reverse_proxy 192.168.8.53:24817
        }
      }
    }
    # Agents are ClusterIP only. 192.168.0.1 is mist-dragon, the source
    # of vpn-relay, so a public request is refused. The rest of the
    # house LAN is allowed. No other VPN client prefix is recorded.
    hermes.stealthdragonland.net {
      @relay remote_ip 192.168.0.1/32
      handle @relay {
        respond "Forbidden" 403
      }
      @lan remote_ip 192.168.0.0/16
      handle @lan {
        reverse_proxy hermes.agents.svc.cluster.local:9119
      }
      handle {
        respond "Forbidden" 403
      }
    }
    hermes-api.stealthdragonland.net {
      @relay remote_ip 192.168.0.1/32
      handle @relay {
        respond "Forbidden" 403
      }
      @lan remote_ip 192.168.0.0/16
      handle @lan {
        reverse_proxy hermes.agents.svc.cluster.local:8642
      }
      handle {
        respond "Forbidden" 403
      }
    }
