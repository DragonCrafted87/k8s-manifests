---
apiVersion: v1
kind: Service
metadata:
  namespace: infrastructure
  name: authentik-postgres
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    role: authentik-postgres
---
apiVersion: v1
kind: Service
metadata:
  namespace: infrastructure
  name: authentik-tcp
spec:
  ports:
  - name: http
    port: 80
    targetPort: 9000
    protocol: TCP
  selector:
    role: authentik
  type: LoadBalancer
  loadBalancerIP: 192.168.8.54
