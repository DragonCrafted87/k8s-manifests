---
# ghcr.io/goauthentik/server:2026.8.5. The image runs as uid 1000.
# Secrets authentik-database and authentik-secret are not in git.
# The worker has no Docker socket. The embedded outpost is off.
# forward_auth is a later step. /data is NFS uid 1000.
# akadmin's email is the Forgeledger site admin, from the secret,
# so the first sign-in can link that one account.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: infrastructure
  name: authentik
  labels:
    app: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      role: authentik
  template:
    metadata:
      labels:
        role: authentik
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: server
        # yamllint disable-line rule:line-length
        image: ghcr.io/goauthentik/server@sha256:6b924afb97053a27ca3f42f006c920464fb77763558c72219019365db191827b
        imagePullPolicy: IfNotPresent
        args: [server]
        env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret-key
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: bootstrap-password
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: bootstrap-email
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-postgres
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-database
              key: password
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: 'false'
        - name: AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST
          value: 'true'
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        startupProbe:
          httpGet:
            path: /-/health/live/
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /-/health/ready/
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /-/health/live/
            port: http
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: templates
          mountPath: /templates
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/authentik/data
      - name: templates
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/authentik/templates
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: infrastructure
  name: authentik-worker
  labels:
    app: authentik-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      role: authentik-worker
  template:
    metadata:
      labels:
        role: authentik-worker
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: worker
        # yamllint disable-line rule:line-length
        image: ghcr.io/goauthentik/server@sha256:6b924afb97053a27ca3f42f006c920464fb77763558c72219019365db191827b
        imagePullPolicy: IfNotPresent
        args: [worker]
        env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret-key
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: bootstrap-password
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: bootstrap-email
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-postgres
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-database
              key: password
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: 'false'
        - name: FL_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: client-secret
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: templates
          mountPath: /templates
        - name: blueprints
          mountPath: /blueprints/custom
          readOnly: true
      volumes:
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/authentik/data
      - name: templates
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/authentik/templates
      - name: blueprints
        configMap:
          name: authentik-blueprint
