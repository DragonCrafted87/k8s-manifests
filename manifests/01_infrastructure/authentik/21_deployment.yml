apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: infrastructure
  name: authentik
  labels:
    app: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      role: authentik
  template:
    metadata:
      labels:
        role: authentik
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        image: authentik/server:2026.8.4
        imagePullPolicy: IfNotPresent
        args: [server]
        env:
        - name: TZ
          value: America/Chicago
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-postgres
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-database
              key: password
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: 'false'
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: 192.168.0.0/16,10.42.0.0/16,10.43.0.0/16
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /-/health/ready/
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
      - name: worker
        image: authentik/server:2026.8.4
        imagePullPolicy: IfNotPresent
        args: [worker]
        env:
        - name: TZ
          value: America/Chicago
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-postgres
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-database
              key: password
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: 'false'
        volumeMounts:
        - name: data
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: data
        nfs:
          server: hoard-drake.stealthdragonland.net
          path: /srv/data/authentik/data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
