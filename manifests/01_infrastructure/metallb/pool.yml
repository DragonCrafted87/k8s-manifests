---
# Applied after the MetalLB native manifest from setup-cluster.sh.
# The live microk8s pool on 2026-10-03 was 192.168.8.1-192.168.15.255.
# Every Service address in this repo sits in 192.168.8.0/24, which is
# the pool the cutover note keeps.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
  namespace: metallb-system
spec:
  addresses:
  - 192.168.8.0/24
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
spec:
  ipAddressPools:
  - lan
